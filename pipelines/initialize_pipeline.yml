##############################################################################################################
#                                                                                                            #
# initialize_pipeline.yml : Initialize the repository and also the play/build stage                          #
#                                                                                                            #
# ####### Inputs ########                                                                                    #
# assetIDList: (Optional) Comma separated list of asset Ids to be Imported                                   #
# assetNameList: (Optional) Comma separatred asset name list                                                 #
# assetTypeList: (Optional) Comma seperated asset Type List. Currently supported options: workflow,          #
#                 flowservice, referenceData, rest_api & project_parameter                                   #
# devUser: (Optional) UserID for commits and audit                                                           #
# featureBranchName: ((Mandatory) Name of the feature branch.                                                #
# repoName: (Mandatory) Name of the corresponding repository.                                                #
# synchProject: (Mandatory) True if you want to synchronize complete project. If false, then you have to     #
#                provide assetID and assetType                                                               #
##############################################################################################################

trigger: none

parameters:
- name: externalGitEnabled
  displayName: Create project with external Git
  type: boolean
  default: false
- name: externalGitAccountAlias
  displayName: External Git connection alias
  type: string
  default: 'NA'
- name: externalGitBranch
  displayName: External Git project branch
  type: string
  default: dev

pool:
  vmImage: ubuntu-latest

variables:
- name: init
  value: true
- group: webMethodsIO_group
- group: azure_group
- group: github_group
- name: repoPath
  value: $(gitOwner)/$(repoName)



steps:
- checkout: self
  submodules: "true"
  persistCredentials: "true"
  clean: "true"
  path: self

- script: |
    echo "##vso[task.setvariable variable=assetIDList;]NA"
    echo "##vso[task.setvariable variable=assetTypeList;]NA"
    echo "##vso[task.setvariable variable=assetNameList;]NA"
  condition: eq(variables['synchProject'], 'true') 
  displayName: 'Adjust variables'



- bash: |
    pwd
    cd ../self
    pwd
    ls -ltr
    echo "##vso[task.setvariable variable=source_environment_hostname]`yq -e ".tenant.hostname" configs/env/play.yml`"
    echo "##vso[task.setvariable variable=source_environment_port]`yq -e ".tenant.port" configs/env/play.yml`"
    echo "##vso[task.setvariable variable=admin_user]`yq -e ".tenant.admin_username" configs/env/play.yml`"
    echo "##vso[task.setvariable variable=source_type]`yq -e ".tenant.type" configs/env/play.yml`"
    tenant_generation=$(yq -r '.tenant.generation // "gen1"' configs/env/play.yml)
    echo "##vso[task.setvariable variable=tenant_generation]${tenant_generation}"
    echo "##vso[task.setvariable variable=repo_user]`yq -e ".repo.user" configs/repo.yml`"
    echo "##vso[task.setvariable variable=provider]`yq -e '.security.provider // \"azure\"' configs/repo.yml`"

    echo "##vso[build.updatebuildnumber]$(Build.BuildNumber)-$(repoName)"
    echo $(System.DefaultWorkingDirectory)
  workingDirectory: '$(System.DefaultWorkingDirectory)'
  displayName: 'Get Environment Tenant Details'
# setup python environment
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.10'
    addToPath: true

- script: |
    
    python3.10 -m pip3 install --upgrade pip
    pip3 install pynacl
    chmod +x ./pipelines/scripts/github/encryptGithubSecret.py

  displayName: 'Setup Python3 Environment'
  workingDirectory: '$(System.DefaultWorkingDirectory)'
  condition: succeeded()
- script: |
      export IWHI_BASE_URL="https://$(source_environment_hostname):$(source_environment_port)"
      export TENANT_GENERATION="$(tenant_generation)"
      export PATH="$(System.DefaultWorkingDirectory)/pipelines/scripts/http:${PATH}"
      chmod +x ./pipelines/scripts/prepareExternalGitProject.sh ./pipelines/scripts/github/validateExternalGitRepo.sh
      if ! external_git_config=$(./pipelines/scripts/prepareExternalGitProject.sh \
        "$(repo_user)" "$(PAT)" "$(repoName)" \
        "${{ parameters.externalGitEnabled }}" "${{ parameters.externalGitAccountAlias }}" \
        "${{ parameters.externalGitBranch }}" \
        "https://$(source_environment_hostname):$(source_environment_port)" \
        "$(admin_user)" "$TENANT_ADMIN_PASSWORD" debug); then
        echo "##vso[task.logissue type=error;]External Git preparation failed."
        exit 1
      fi

      echo "##vso[task.setvariable variable=externalGitEnabledValue]$(echo "$external_git_config" | jq -r '.enabled')"
      echo "##vso[task.setvariable variable=externalGitProjectExisted]$(echo "$external_git_config" | jq -r '.projectExists')"
      echo "##vso[task.setvariable variable=externalGitAccountAliasValue]$(echo "$external_git_config" | jq -r '.gitAccountAlias')"
      echo "##vso[task.setvariable variable=externalGitRepository]$(echo "$external_git_config" | jq -r '.physicalRepository')"
      echo "##vso[task.setvariable variable=externalGitApiRepositoryPath]$(echo "$external_git_config" | jq -r '.apiRepositoryPath')"
      echo "##vso[task.setvariable variable=externalGitBranchValue]$(echo "$external_git_config" | jq -r '.branch')"
  displayName: 'Prepare external Git project repository'
  workingDirectory: '$(System.DefaultWorkingDirectory)'
  condition: succeeded()
  env:
    TENANT_ADMIN_PASSWORD: $(play_admin_password)
    INSTANCE_API_KEY: $(play_instance_api_key)
- script: |
      set -e
      cd ../

      ########GitHub 
        HOME_DIR=$(System.DefaultWorkingDirectory)/../

        # Fail fast if GitHub auth is bad (401) so we don't proceed to project creation
        status=$(curl -s -o /tmp/repo_check.json -w "%{http_code}" -u "$(repo_user):$(PAT)" "https://api.github.com/repos/$(repo_user)/$(repoName)")
        if [ "$status" = "401" ]; then
          echo "GitHub auth failed (401) for $(repo_user). Check PAT."
          exit 1
        fi

        chmod +x ./self/pipelines/scripts/github/*.sh
        ./self/pipelines/scripts/github/initializeRepo.sh $(repo_user) $(PAT) $(AZURE_TOKEN) $(repoName) $(devUser) $(featureBranchName) ${HOME_DIR} debug

  displayName: 'Create a repo and required branches'
  condition: succeeded()
- script: |
      set -e
      cd ../
      LOCAL_DEV_URL=https://$(source_environment_hostname):$(source_environment_port)
      export IWHI_BASE_URL="$LOCAL_DEV_URL"
      export TENANT_GENERATION="$(tenant_generation)"
      export PATH="$(System.DefaultWorkingDirectory)/../self/pipelines/scripts/http:${PATH}"
      echo ${LOCAL_DEV_URL}
      HOME_DIR=$(System.DefaultWorkingDirectory)/../
      : ${provider:=azure}
      if [ $(init) == true ]; then
        echo "New repo created"
        ######## Check & Create Project 
        chmod +x ./self/pipelines/scripts/*.sh
        if ! project_id=$(./self/pipelines/scripts/createProject.sh \
          "${LOCAL_DEV_URL}" \
          "$(admin_user)" \
          "$TENANT_ADMIN_PASSWORD" \
          "$(repoName)" \
          "" \
          "$(externalGitEnabledValue)" \
          "$(externalGitAccountAliasValue)" \
          "$(externalGitApiRepositoryPath)" \
          "$(externalGitBranchValue)" \
          "" \
          "debug" 2> >(tee >&2)); then
          echo "##vso[task.logissue type=error;]Project creation failed. Project configuration will not be committed."
          exit 1
        fi
        echo "Captured Project ID: [$project_id]"
        ./self/pipelines/scripts/github/saveProjectConfig.sh \
          "$(repoName)" "$project_id" "${HOME_DIR}" "$(devUser)" "$(featureBranchName)" \
          "$(externalGitEnabledValue)" "$(externalGitRepository)" \
          "$(externalGitApiRepositoryPath)" "$(externalGitBranchValue)" \
          "$(externalGitAccountAliasValue)" "$(externalGitProjectExisted)" "false" debug
      else
        ######## Create a feature branch from prod 
        echo "Repo Exists, Check and sync feature branch from Prod"
        if [ $(synchProject) != true ]; then
          echo "Patch Initialize"
          if [ -z "$(assetIDList)" ]; then
            echo "##vso[task.logissue type=error;]Missing parameter \"assetIDList\""
            echo "##vso[task.complete result=Failed;]"
            exit 1
          fi
                  
          if [ -z "$(assetTypeList)" ]; then
            echo "##vso[task.logissue type=error;]Missing parameter \"assetTypeList\""
            echo "##vso[task.complete result=Failed;]"
            exit 1
          fi
        else
          echo "Project Initialize"
       fi  
          rm -rf ./$(repoName)

          git clone -b production "https://$(repo_user):$(PAT)@github.com/$(repo_user)/$(repoName).git"
          cd $(repoName)

          # Project creation must not depend on whether the requested feature
          # branch already exists. In particular, external Git initialization must
          # still call createProject.sh so the external Git details are sent.
          chmod +x ../self/pipelines/scripts/*.sh
          echo "Check and create Project ..."
          if ! project_id=$(../self/pipelines/scripts/createProject.sh \
            "${LOCAL_DEV_URL}" \
            "$(admin_user)" \
            "$TENANT_ADMIN_PASSWORD" \
            "$(repoName)" \
            "" \
            "$(externalGitEnabledValue)" \
            "$(externalGitAccountAliasValue)" \
            "$(externalGitApiRepositoryPath)" \
            "$(externalGitBranchValue)" \
            "" \
            "debug" 2> >(tee >&2)); then
            echo "##vso[task.logissue type=error;]Project creation failed. Asset import has been stopped."
            exit 1
          fi
          echo "Captured Project ID: [$project_id]"

          branchLookupStatus=0
          git ls-remote --exit-code --heads origin "$(featureBranchName)" >/dev/null 2>&1 || branchLookupStatus=$?
          if [ "${branchLookupStatus}" -eq 0 ]; then
              echo "Branch $(featureBranchName) already exists"
              git checkout -B "$(featureBranchName)" "origin/$(featureBranchName)"
          elif [ "${branchLookupStatus}" -eq 2 ]; then
              echo "Branch $(featureBranchName) doesnt exist. Creating and validating a recovery snapshot of the live development project ..."
              chmod +x ../self/pipelines/scripts/createRecoverySnapshot.sh \
                ../self/pipelines/scripts/github/exportRecoveryProject.sh
              envTypes=$(../self/pipelines/scripts/readEnvs.sh "${HOME_DIR}self/configs/env" "$(source_type)")
              recoveryBranch="recovery/$(featureBranchName)/$(Build.BuildId)"
              if ! ../self/pipelines/scripts/createRecoverySnapshot.sh \
                "$(repoName)" "${HOME_DIR}" "$(devUser)" "$(Build.BuildNumber)" \
                "${recoveryBranch}" production \
                "${HOME_DIR}self/pipelines/scripts/github/exportRecoveryProject.sh" debug \
                "${LOCAL_DEV_URL}" "$(admin_user)" "$TENANT_ADMIN_PASSWORD" "$(repoName)" \
                "${HOME_DIR}" "$(source_type)" "${envTypes}" "$(repo_user)" "$(PAT)" \
                "${provider}" "$(AZURE_VAULT_NAME)" "$(AZURE_RESOURCE_GROUP)" \
                "$(AZURE_LOCATION)" "$(AZURE_TENANT_ID)" "$(AZURE_CLIENT_ID)" \
                "$(AZURE_CLIENT_SECRET)" "$(AZURE_ACCESS_OBJECT_ID)" debug; then
                echo "##vso[task.logissue type=error;]Recovery preflight failed. No feature branch was created and no project content was imported."
                exit 1
              fi

              echo "Recovery snapshot matches production. Creating $(featureBranchName) from production ..."
              chmod +x ../self/pipelines/scripts/github/*.sh
              ../self/pipelines/scripts/github/createFeatureFromProdBranch.sh $(devUser) $(featureBranchName) ${HOME_DIR} debug

              echo "Importing external packages from feature-branch scaffolding ..."
              ../self/pipelines/scripts/importDadaPackages.sh \
                "${LOCAL_DEV_URL}" "$(admin_user)" "$TENANT_ADMIN_PASSWORD" "$(repoName)" \
                "${HOME_DIR}/$(repoName)" "$(source_type)" debug || exit $?

              # Import (align with synchronizeDEV: include provider/Azure params)
              echo "Importing asset ..."
              assetIDListClean="NA"
              assetTypeListClean="NA"
              ../self/pipelines/scripts/importAsset.sh "${LOCAL_DEV_URL}" "$(admin_user)" "$TENANT_ADMIN_PASSWORD" "$(repoName)" "${assetIDListClean}" "${assetTypeListClean}" "${HOME_DIR}" "$(synchProject)" "$(source_type)" true "${provider}" "$(AZURE_VAULT_NAME)" "$(AZURE_RESOURCE_GROUP)" "$(AZURE_LOCATION)" "$(AZURE_TENANT_ID)" "$(AZURE_CLIENT_ID)" "$(AZURE_CLIENT_SECRET)" "$(AZURE_ACCESS_OBJECT_ID)" "debug" || {
                importStatus=$?
                echo "##vso[task.logissue type=error;]Project asset import failed with exit code ${importStatus}."
                exit "${importStatus}"
              }
          else
              echo "##vso[task.logissue type=error;]Unable to check feature branch $(featureBranchName) on origin (git exit code ${branchLookupStatus})."
              exit "${branchLookupStatus}"
          fi

          if [ -z "$project_id" ]; then
            project_id=$(curl --silent --location --request GET \
              "${LOCAL_DEV_URL}/apis/v1/rest/projects/$(repoName)" \
              --header 'Accept: application/json' \
              --user "$(admin_user):${TENANT_ADMIN_PASSWORD}" | jq -r '.output.uid // empty')
          fi
          if [ -z "$project_id" ]; then
            echo "##vso[task.logissue type=error;]Project ID is unavailable after initialization/import; project configuration cannot be updated."
            exit 1
          fi

          # Always refresh project metadata, including when both the project
          # and automation repository existed before this initialization run.
          ../self/pipelines/scripts/github/saveProjectConfig.sh \
            "$(repoName)" "$project_id" "${HOME_DIR}" "$(devUser)" "$(featureBranchName)" \
            "$(externalGitEnabledValue)" "$(externalGitRepository)" \
            "$(externalGitApiRepositoryPath)" "$(externalGitBranchValue)" \
            "$(externalGitAccountAliasValue)" "$(externalGitProjectExisted)" "true" debug
      fi
  displayName: 'Create / Sychronize the projects'
  condition: succeeded()
  env:
    TENANT_ADMIN_PASSWORD: $(play_admin_password)
    INSTANCE_API_KEY: $(play_instance_api_key)
