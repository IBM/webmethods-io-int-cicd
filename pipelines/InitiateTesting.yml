##############################################################################################################
#                                                                                                            #
# InitiateTesting_pipeline.yml : Starts testing for a specific repo on specific stage                        #
#                                                                                                            #
# ####### Inputs ########                                                                                    #
# branch: (Mandatory) Which branch should be referred for test cases                                         #
# environment: (Mandatory) On which stage should be Test triggered                                           #
# repoName: (Mandatory) Name of the corresponding repository.                                                #
##############################################################################################################

trigger:
- none

variables:
- group: github_group
- group: webMethodsIO_group
- name: repoPath
  value: $(gitOwner)/$(repoName)

pool:
  vmImage: ubuntu-latest
resources:
  repositories:
  - repository: projectRepo
    type: github
    endpoint: github
    name: $(repoPath)
    ref: $(branch)
steps:
- checkout: projectRepo
  submodules: "true"
  persistCredentials: "true"
  clean: "true"
  path: $(repoName)
- checkout: self
  submodules: "true"
  persistCredentials: "true"
  clean: "true"
  path: self
  
- bash: |
    cd ../
    source=$(echo $(resources.triggeringAlias))
    
    if [ -z "$source" ]; then
      source=$(echo $(environment))
      cd $(repoName)
    fi
    echo "##vso[task.setvariable variable=source_type]${source}"
    cd ../self
    pwd
    ls -ltr
    echo "##vso[task.setvariable variable=admin_user]`yq -e ".tenant.admin_username" configs/env/${source}.yml`"

    case "${source}" in
      play) tenant_password="${PLAY_ADMIN_PASSWORD}" ;;
      dev) tenant_password="${DEV_ADMIN_PASSWORD}" ;;
      qa) tenant_password="${QA_ADMIN_PASSWORD}" ;;
      prod) tenant_password="${PROD_ADMIN_PASSWORD}" ;;
      *)
        echo "##vso[task.logissue type=error;]Unsupported test environment '${source}'."
        exit 1
        ;;
    esac
    if [ -z "${tenant_password}" ]; then
      echo "##vso[task.logissue type=error;]The admin password for '${source}' is not configured."
      exit 1
    fi
    echo "##vso[task.setvariable variable=tenant_admin_password;issecret=true]${tenant_password}"
    
    echo $(System.DefaultWorkingDirectory)
  workingDirectory: '$(System.DefaultWorkingDirectory)'
  displayName: 'Get Environment Tenant Details'
  env:
    PLAY_ADMIN_PASSWORD: $(play_admin_password)
    DEV_ADMIN_PASSWORD: $(dev_admin_password)
    QA_ADMIN_PASSWORD: $(qa_admin_password)
    PROD_ADMIN_PASSWORD: $(prod_admin_password)

- script: |
    cd ../$(repoName)
    pwd
    echo $(source_type)
    echo $(admin_user)
    ls -ltr $(System.DefaultWorkingDirectory)/$(source_type)/results/"    

    newman run ./resources/test/wmio_test.json -e ./resources/test/environments/$(source_type).json --env-var "project=$(repoName)" --env-var "user=$(admin_user)" --env-var "password=$(tenant_admin_password)" --reporters cli,junit --reporter-junit-export $(System.DefaultWorkingDirectory)/$(source_type)/results/junitReport.xml
    ls -ltr $(System.DefaultWorkingDirectory)/$(source_type)/results/
  displayName: 'Run newman'
- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/junit*.xml'
    searchFolder: '$(System.DefaultWorkingDirectory)/$(source_type)/results'
    failTaskOnFailedTests: true
    testRunTitle: '$(source_type) Test Run'
