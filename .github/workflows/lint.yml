name: Lint Scripts

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash syntax check
        run: |
          find pipelines/scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Shellcheck
        run: |
          find pipelines/scripts -name '*.sh' -print0 | xargs -0 shellcheck
