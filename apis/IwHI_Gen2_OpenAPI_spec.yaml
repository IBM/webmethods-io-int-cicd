openapi: 3.0.3
info:
  title: IwHI Gen2 API
  version: 1.0.0
  description: OpenAPI conversion of the supplied WMIO Open API V5 Pre and V4 Postman exports. HTTP Basic authentication is
    the global default. The Gen2 x-instance-api-key scheme is also declared and can be selected as an operation-level override.
servers:
- url: '{baseUrl}'
  variables:
    baseUrl:
      default: https://your-tenant.webmethods.io
tags:
- name: Roles
- name: Alerts
- name: Vault Variables
- name: Version Control
- name: Monitoring
- name: Workflows
- name: Projects
- name: Schedulers
- name: Certificates
- name: Project Configuration
- name: Project Variables
- name: Connections
- name: Imported Packages
- name: Accounts
- name: Flow Services
- name: Recipes
- name: Themes
- name: Users
- name: Other
- name: Runtime Management
paths:
  /apis/v1/rest/assign-roles:
    put:
      tags:
      - Roles
      summary: Assign a Role to user.
      operationId: put_apis_v1_rest_assign_roles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  output:
                    type: object
                    properties:
                      uid:
                        type: string
                      email:
                        type: string
                      wmic_username:
                        type: string
                      roles:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            ic_role_name:
                              type: string
                            description:
                              type: string
                            permissions:
                              type: array
                              items:
                                type: object
                                properties:
                                  access_list:
                                    type: object
                                    properties:
                                      read:
                                        type: string
                                      write:
                                        type: string
                                      execute:
                                        type: string
                                  project_uid:
                                    type: string
                            wmic_role_id:
                              type: string
                            created_at:
                              type: string
                            updated_at:
                              type: string
                            uid:
                              type: string
                      is_admin:
                        type: string
                      is_developer:
                        type: string
                      is_owner:
                        type: string
              example:
                output:
                  uid: <string>
                  email: <string>
                  wmic_username: <string>
                  roles:
                  - name: <string>
                    ic_role_name: <string>
                    description: <string>
                    permissions:
                    - access_list:
                        read: <boolean>
                        write: <boolean>
                        execute: <boolean>
                      project_uid: <string>
                    - access_list:
                        read: <boolean>
                        write: <boolean>
                        execute: <boolean>
                      project_uid: <string>
                    wmic_role_id: <string>
                    created_at: <string>
                    updated_at: <string>
                    uid: <string>
                  - name: <string>
                    ic_role_name: <string>
                    description: <string>
                    permissions:
                    - access_list:
                        read: <boolean>
                        write: <boolean>
                        execute: <boolean>
                      project_uid: <string>
                    - access_list:
                        read: <boolean>
                        write: <boolean>
                        execute: <boolean>
                      project_uid: <string>
                    wmic_role_id: <string>
                    created_at: <string>
                    updated_at: <string>
                    uid: <string>
                  is_admin: <boolean>
                  is_developer: <boolean>
                  is_owner: <boolean>
        '400':
          description: Bad Request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                roles:
                  type: array
                  items:
                    type: string
            example:
              username: <string>
              roles:
              - <string>
              - <string>
  /apis/v1/rest/configurations/alert-rules:
    post:
      tags:
      - Alerts
      summary: Create alert
      operationId: post_apis_v1_rest_configurations_alert_rules
      responses:
        default:
          description: API response
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
          example: WorkflowAlertRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                users:
                  type: array
                  items:
                    type: string
                events:
                  type: object
                  properties:
                    failed:
                      type: boolean
                    success:
                      type: boolean
                    timeout:
                      type: boolean
                integrations:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      project:
                        type: string
            example:
              name: test-wf-alert-rule
              description: sample-description
              users:
              - nawajish.laskar@softwareag.com
              events:
                failed: true
                success: true
                timeout: false
              integrations:
              - name: Sanity
                project: LDS
    get:
      tags:
      - Alerts
      summary: Get all alerts
      operationId: get_apis_v1_rest_configurations_alert_rules
      responses:
        default:
          description: API response
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
          example: WorkflowAlertRule
  /apis/v1/rest/configurations/alert-rules/tested:
    get:
      tags:
      - Alerts
      summary: GetAlert
      operationId: get_apis_v1_rest_configurations_alert_rules_tested
      responses:
        default:
          description: API response
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
          example: FlowAlertRule
  /apis/v1/rest/configurations/alert-rules/testfsalert/active:
    put:
      tags:
      - Alerts
      summary: changeAlertState
      operationId: put_apis_v1_rest_configurations_alert_rules_testfsalert_active
      responses:
        default:
          description: API response
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
          example: FlowAlertRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alertNames:
                  type: array
                  items:
                    type: string
                alertEnabled:
                  type: string
            example:
              alertNames:
              - testfsalert
              alertEnabled: 'false'
  /apis/v1/rest/configurations/alert-rules/testfsalert/validate:
    get:
      tags:
      - Alerts
      summary: ValidateFlowAlertr
      operationId: get_apis_v1_rest_configurations_alert_rules_testfsalert_validate
      responses:
        default:
          description: API response
  /apis/v1/rest/configurations/alert-rules/{rule-name}:
    delete:
      tags:
      - Alerts
      summary: Delete alert
      operationId: delete_apis_v1_rest_configurations_alert_rules_rule_name
      responses:
        default:
          description: API response
      parameters:
      - name: rule-name
        in: path
        required: true
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
          example: WorkflowAlertRule
    get:
      tags:
      - Alerts
      summary: Get alert details
      operationId: get_apis_v1_rest_configurations_alert_rules_rule_name
      responses:
        default:
          description: API response
      parameters:
      - name: rule-name
        in: path
        required: true
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
          example: WorkflowAlertRule
    put:
      tags:
      - Alerts
      summary: Update alert
      operationId: put_apis_v1_rest_configurations_alert_rules_rule_name
      responses:
        default:
          description: API response
      parameters:
      - name: rule-name
        in: path
        required: true
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
          example: WorkflowAlertRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                enabled:
                  type: boolean
                description:
                  type: string
                users:
                  type: array
                  items:
                    type: string
                events:
                  type: object
                  properties:
                    failed:
                      type: boolean
                    success:
                      type: boolean
                    timeout:
                      type: boolean
                integrations:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      project:
                        type: string
            example:
              name: test-wf-alert-rule
              enabled: false
              description: updated-description
              users:
              - nawajish.laskar@softwareag.com
              events:
                failed: false
                success: true
                timeout: false
              integrations:
              - name: Sanity
                project: LDS
  /apis/v1/rest/configurations/alert-rules/{rule-name}/inactives:
    put:
      tags:
      - Alerts
      summary: Toggle alert state
      operationId: put_apis_v1_rest_configurations_alert_rules_rule_name_inactives
      responses:
        default:
          description: API response
      parameters:
      - name: rule-name
        in: path
        required: true
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
          example: WorkflowAlertRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
            example: {}
  /apis/v1/rest/configurations/variables:
    get:
      tags:
      - Vault Variables
      summary: All vault items
      operationId: get_apis_v1_rest_configurations_variables
      responses:
        default:
          description: API response
    post:
      tags:
      - Vault Variables
      summary: Create a vault item
      operationId: post_apis_v1_rest_configurations_variables
      responses:
        default:
          description: API response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                value:
                  type: string
                isPassword:
                  type: boolean
            example:
              key: second
              value: test
              isPassword: false
  /apis/v1/rest/configurations/variables/{variable_name}:
    delete:
      tags:
      - Vault Variables
      summary: Delete a vault item
      operationId: delete_apis_v1_rest_configurations_variables_variable_name
      responses:
        default:
          description: API response
      parameters:
      - name: variable_name
        in: path
        required: true
        schema:
          type: string
    put:
      tags:
      - Vault Variables
      summary: Update a vault item
      operationId: put_apis_v1_rest_configurations_variables_variable_name
      responses:
        default:
          description: API response
      parameters:
      - name: variable_name
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
            example:
              value: testing
    get:
      tags:
      - Vault Variables
      summary: Vault item details
      operationId: get_apis_v1_rest_configurations_variables_variable_name
      responses:
        default:
          description: API response
      parameters:
      - name: variable_name
        in: path
        required: true
        schema:
          type: string
  /apis/v1/rest/configurations/variables/{variable_name}/sync:
    put:
      tags:
      - Vault Variables
      summary: Sync project variables with vault item
      operationId: put_apis_v1_rest_configurations_variables_variable_name_sync
      responses:
        default:
          description: API response
      parameters:
      - name: variable_name
        in: path
        required: true
        schema:
          type: string
      - name: projects
        in: query
        required: false
        schema:
          type: string
          example: ''
  /apis/v1/rest/configurations/version-control/accounts:
    post:
      tags:
      - Version Control
      summary: CreateVersionControlGitAccount
      operationId: post_apis_v1_rest_configurations_version_control_accounts
      responses:
        default:
          description: API response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                type:
                  type: string
                hostname:
                  type: string
                credentials:
                  type: object
                  properties:
                    username:
                      type: string
                    accessToken: ""
                      type: string
            example:
              displayName: githubacc
              type: github
              hostname: github.com
              credentials:
                username: XXXXXXXXXXXXXXX
                accessToken: ""
    get:
      tags:
      - Version Control
      summary: GetVersionControl
      operationId: get_apis_v1_rest_configurations_version_control_accounts
      responses:
        default:
          description: API response
    put:
      tags:
      - Version Control
      summary: Update an existing Version Control account
      operationId: put_apis_v1_rest_configurations_version_control_accounts
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '502':
          description: Bad Gateway
      description: Update an existing Version Control account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                type:
                  type: string
                hostname:
                  type: string
                credentials:
                  type: object
                  properties:
                    username:
                      type: string
                    accessToken: ""
                      type: string
            example:
              displayName: githubacc
              type: github
              hostname: github.com
              credentials:
                username: <GIT-USER>
                accessToken: ""
  /apis/v1/rest/configurations/version-control/accounts/validate:
    post:
      tags:
      - Version Control
      summary: ValidateGitAccount
      operationId: post_apis_v1_rest_configurations_version_control_accounts_validate
      responses:
        default:
          description: API response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                type:
                  type: string
                hostname:
                  type: string
                credentials:
                  type: object
                  properties:
                    username:
                      type: string
                    accessToken: ""
                      type: string
            example:
              displayName: githubacc
              type: github
              hostname: github.com
              credentials:
                username: rajkapoor-rajkapoor
                accessToken: ""
  /apis/v1/rest/configurations/version-control/accounts/{displayName}:
    delete:
      tags:
      - Version Control
      summary: Delete a version control account from webMethods.io tenant. Input is the display name of version control
      operationId: delete_apis_v1_rest_configurations_version_control_accounts_displayName
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '502':
          description: Bad Gateway
      description: Delete a version control account from webMethods.io tenant. Input is the display name of version control
      parameters:
      - name: displayName
        in: path
        required: true
        schema:
          type: string
  /apis/v1/rest/monitor/summary:
    post:
      tags:
      - Monitoring
      summary: Fetch Execution Summary based on the provided search parameters.
      operationId: post_apis_v1_rest_monitor_summary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  output:
                    type: object
                    properties:
                      summary:
                        type: object
                        properties:
                          success:
                            type: string
                          running:
                            type: string
                          stopped:
                            type: string
                          failed:
                            type: string
                          timeout:
                            type: string
                          pending:
                            type: string
                          hold:
                            type: string
                      graph:
                        type: object
                        properties:
                          count:
                            type: string
                          logs:
                            type: array
                            items:
                              type: object
                              properties:
                                uid:
                                  type: string
                                execution_status:
                                  type: string
                                flow_name:
                                  type: string
                                flow_uid:
                                  type: string
                                project_uid:
                                  type: string
                                restarted:
                                  type: string
                                requested_at:
                                  type: string
                                project_name:
                                  type: string
                                execution_source:
                                  type: string
              example:
                output:
                  summary:
                    success: <string>
                    running: <string>
                    stopped: <string>
                    failed: <string>
                    timeout: <string>
                    pending: <string>
                    hold: <string>
                  graph:
                    count: <integer>
                    logs:
                    - uid: <string>
                      execution_status: <string>
                      flow_name: <string>
                      flow_uid: <string>
                      project_uid: <string>
                      restarted: <string>
                      requested_at: <string>
                      project_name: <string>
                      execution_source: <string>
                    - uid: <string>
                      execution_status: <string>
                      flow_name: <string>
                      flow_uid: <string>
                      project_uid: <string>
                      restarted: <string>
                      requested_at: <string>
                      project_name: <string>
                      execution_source: <string>
        '400':
          description: Bad Request
      parameters:
      - name: skip
        in: query
        required: false
        schema:
          type: string
          example: <integer>
        description: The number of items to skip.
      - name: limit
        in: query
        required: false
        schema:
          type: string
          example: <integer>
        description: The number of items per page limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start_date:
                  type: string
                end_date:
                  type: string
                projects:
                  type: array
                  items:
                    type: string
                workflows:
                  type: array
                  items:
                    type: string
                execution_status:
                  type: array
                  items:
                    type: string
            example:
              start_date: <string>
              end_date: <string>
              projects:
              - <string>
              - <string>
              workflows:
              - <string>
              - <string>
              execution_status:
              - <string>
              - <string>
  /apis/v1/rest/monitor/workflow-execution/logs/{BillUid}:
    get:
      tags:
      - Workflows
      summary: Get Details of Particular Execution.
      operationId: get_apis_v1_rest_monitor_workflow_execution_logs_BillUid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  output:
                    type: object
                    properties:
                      uid:
                        type: string
                      duration:
                        type: string
                      executed_by:
                        type: string
                      execution_status:
                        type: string
                      flow_name:
                        type: string
                      manual_run:
                        type: string
                      project_uid:
                        type: string
                      queue:
                        type: string
                      trigger:
                        type: string
                      start_time:
                        type: string
                      stop_time:
                        type: string
                      requested_at:
                        type: string
                      project_name:
                        type: string
                      transaction_count:
                        type: string
              example:
                output:
                  uid: <string>
                  duration: <string>
                  executed_by: <string>
                  execution_status: <string>
                  flow_name: <string>
                  manual_run: <string>
                  project_uid: <string>
                  queue: <string>
                  trigger: <string>
                  start_time: <string>
                  stop_time: <string>
                  requested_at: <string>
                  project_name: <string>
                  transaction_count: <integer>
        '400':
          description: Bad Request
      parameters:
      - name: BillUid
        in: path
        required: true
        schema:
          type: string
  /apis/v1/rest/project-import:
    post:
      tags:
      - Projects
      summary: ImportProject Copy
      operationId: post_apis_v1_rest_project_import
      responses:
        default:
          description: API response
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                project:
                  type: string
                  format: binary
                new_project_name:
                  type: string
            example:
              new_project_name: ICUI_Project
  /apis/v1/rest/projects:
    post:
      tags:
      - Projects
      summary: Create project in target tenant
      operationId: post_apis_v1_rest_projects
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  output:
                    type: object
                    properties:
                      name:
                        type: string
                      uid:
                        type: string
                      tenant_uid:
                        type: string
                      workflow_count:
                        type: integer
                      flowservice_count:
                        type: integer
              example:
                output:
                  name: projectname
                  uid: fl5b58cb31eb65c61455cf22
                  tenant_uid: tenantid
                  workflow_count: 0
                  flowservice_count: 0
        '401':
          description: Unauthorized
      description: Create project in target tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                uid:
                  type: string
            example:
              name: projectname
              uid: fl5b58cb31eb65c61455cf22
    get:
      tags:
      - Projects
      summary: Get a list of projects.
      operationId: get_apis_v1_rest_projects
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    uid:
                      type: string
                    name:
                      type: string
                    workflow_count:
                      type: string
                    flowservice_count:
                      type: string
              example:
              - uid: <string>
                name: <string>
                workflow_count: <string>
                flowservice_count: <string>
              - uid: <string>
                name: <string>
                workflow_count: <string>
                flowservice_count: <string>
        '400':
          description: Bad Request
  /apis/v1/rest/projects/Default/configurations/schedulers/currentDateFS:
    post:
      tags:
      - Schedulers
      summary: CreateFlowScheduler
      operationId: post_apis_v1_rest_projects_Default_configurations_schedulers_currentDateFS
      responses:
        default:
          description: API response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                runOnceType:
                  type: string
                pipeline:
                  nullable: true
                scheduleType:
                  type: string
                executionTime:
                  type: array
                  items:
                    type: integer
                recurrenceType:
                  type: string
                recurrenceInterval:
                  type: integer
                startDate:
                  type: integer
                endDate:
                  type: integer
            example:
              runOnceType: scheduledAt
              pipeline: null
              scheduleType: runRecurrent
              executionTime:
              - 1748583216000
              recurrenceType: Minute
              recurrenceInterval: 600
              startDate: 1748583216000
              endDate: 1761802339000
    delete:
      tags:
      - Schedulers
      summary: DeleteScheduledService
      operationId: delete_apis_v1_rest_projects_Default_configurations_schedulers_currentDateFS
      responses:
        default:
          description: API response
  /apis/v1/rest/projects/Default/configurations/schedulers/currentDateFS/pause:
    post:
      tags:
      - Schedulers
      summary: PauseScheduler
      operationId: post_apis_v1_rest_projects_Default_configurations_schedulers_currentDateFS_pause
      responses:
        default:
          description: API response
  /apis/v1/rest/projects/Default/configurations/schedulers/currentDateFS/resume:
    post:
      tags:
      - Schedulers
      summary: ResumeScheduler
      operationId: post_apis_v1_rest_projects_Default_configurations_schedulers_currentDateFS_resume
      responses:
        default:
          description: API response
  /apis/v1/rest/projects/Default/configurations/schedulers/testHttp:
    get:
      tags:
      - Schedulers
      summary: GetSchedulerByName
      operationId: get_apis_v1_rest_projects_Default_configurations_schedulers_testHttp
      responses:
        default:
          description: API response
  /apis/v1/rest/projects/Default/configurations/schedulers/testHttp/status:
    get:
      tags:
      - Schedulers
      summary: GetScheduledServiceStatus
      operationId: get_apis_v1_rest_projects_Default_configurations_schedulers_testHttp_status
      responses:
