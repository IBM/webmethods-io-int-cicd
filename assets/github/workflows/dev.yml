  name: DEV

  # Synchronize DEV only after a commit lands on the dev branch (for example, after a PR merge).
  on:
    push:
      branches: 
        - dev
  jobs:
      build:
          name: Call Azure Pipeline
          runs-on: ubuntu-latest
          steps:
          - name: Synchronize Dev
            uses: fjogeleit/http-request-action@v1
            with:
              url: 'https://dev.azure.com/SrinivasanSabapathy/webMethodsIO_Integration/_apis/build/builds?api-version=7.1-preview.7'
              method: 'POST'
              username: 'srinivasan.sabapathy@ibm.com'
              password: ${{ secrets.AZURE_DEVOPS_TOKEN }}
              customHeaders: '{"Content-Type": "application/json"}'
              data: '{"parameters": "{\"repoName\":\"${{ github.event.repository.name }}\",\"synchProject\":\"true\"}","definition":{"id": 6}}'

              
